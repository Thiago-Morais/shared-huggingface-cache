services:
    huggingface:
        container_name: huggingface
        env_file:
            - .env
        build:
            context: build
            dockerfile: Dockerfile.with-huggingface-cli
        volumes:
            - huggingface-home:${HF_HOME:-/cache/huggingface}

        # huggingface-home:
        #     container_name: huggingface-home
        #     build:
        #         context: build
        #     volumes:
        # - huggingface-home:${HF_HOME:-/cache/huggingface}

volumes:
    huggingface-home:
        name: huggingface-home
        driver: local
        driver_opts:
            o: bind
            type: none
            device: ${HF_MOUNT:-./huggingface}
